name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff>=0.4.0 bandit

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run bandit SAST scan
        run: bandit -r backend/ -f sarif -o bandit-results.sarif || true

      - name: Check for secrets in tracked files
        run: |
          SECRET_PATTERNS='\.env$|client_secret\.json|service-account.*\.json|\.key$|\.pem$'
          if git ls-files | grep -qE "$SECRET_PATTERNS"; then
            echo "::error::Secret files detected in tracked files!"
            git ls-files | grep -E "$SECRET_PATTERNS"
            exit 1
          fi
          echo "::notice::No secret files tracked"

      - name: Scan for hardcoded secrets
        run: |
          pip install trufflehog 2>/dev/null || true
          if command -v trufflehog &>/dev/null; then
            trufflehog git --since-commit HEAD~1 --no-update --only-verified 2>&1 || true
          fi
          echo "(trufflehog is best run with full history; manual rotation recommended)"

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=backend --cov=database --cov-report=term-missing --cov-report=xml
        env:
          MONGO_URI: mongodb://localhost:27017
          GROQ_API_KEY: ""
          SECRET_KEY: test-secret-key

      - name: Run pip-audit (dependency vulnerability scan)
        run: pip-audit --desc on --ignore-vuln=PYSEC-2023-123 2>&1 || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
